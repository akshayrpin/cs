		<script type="text/javascript" language="javascript" src="cs.carouFredSel.js"></script>

		<!-- fire plugin onDocumentReady -->
		<script type="text/javascript" language="javascript">
			$(function() {
				$('.thumblist').carouFredSel({
					auto: false,
					responsive: true,
					align: 'center',
					prev: '.prevthumb',
					next: '.nextthumb',
					pagination: "#slidepager",
					mousewheel: true,
					items: {
						visible: 6
					},
					swipe: {
						onMouse: true,
						onTouch: true
					}
				});
				$('.slidelist').carouFredSel({
					auto: false,
					responsive: true,
					align: 'center',
					prev: '.prevnav',
					next: '.nextnav',
					pagination: "#slidepager",
					mousewheel: false,
					items: {
						visible: 1
					},
					swipe: {
						onMouse: true,
						onTouch: true
					}
				});
				$('.thumb').click(function() {
					var rel = $(this).attr('rel');
					$('.slidelist').trigger('slideTo', '#' + rel );
					$('.thumblist div').removeClass('selected');
					$(this).addClass('selected');
					return false;
				});
			});
		</script>
